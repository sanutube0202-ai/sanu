<div class="wrap">
  <div class="top"><span class="seg" id="lang"><button data-v="ja" aria-pressed="true">日本語</button><button data-v="en" aria-pressed="false">EN</button></span></div>
  <h1 id="h1">2026年のカレンダー</h1>
  <p class="lede" id="lede">祝日と週のはじまりを選んで、ダウンロード。</p>
  <div class="stage"><canvas id="cal" width="2384" height="3360" aria-label="カレンダー"></canvas></div>
  <div class="panel">
    <div class="nav"><button class="nudge" id="prev" aria-label="前">‹</button><span class="now" id="now">2026 · 9–12月</span><button class="nudge" id="next" aria-label="次">›</button></div>
    <div class="row"><span class="label" id="lWeek">週のはじまり</span><div class="seg" id="weekStart"><button data-v="1" aria-pressed="true" id="wMon">月曜</button><button data-v="0" aria-pressed="false" id="wSun">日曜</button></div></div>

<script>
(function(){
  "use strict";
  const canvas=document.getElementById('cal'), ctx=canvas.getContext('2d');
  const now=new Date(), aS=m=> m<=4?1:(m<=8?5:9);
  const state={ year:now.getFullYear(), start:aS(now.getMonth()+1), weekStart:1, country:'jp', lang:'ja' };
  const WK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const T={ ja:{h1:y=>y+'年のカレンダー',lede:'祝日と週のはじまりを選んで、ダウンロード。',week:'週のはじまり',hol:'祝日',mon:'月曜',sun:'日曜',dl:'ダウンロード',hint:'JPEGで保存 → コンビニや自宅でプリント。'},
             en:{h1:y=>y+' Calendar',lede:'Pick your holidays and week start, then download.',week:'Week starts',hol:'Holidays',mon:'Mon',sun:'Sun',dl:'Download',hint:'Save as JPEG → print at home or a print shop.'} };
  const nth=(y,m,wd,n)=>{const d=new Date(y,m-1,1);return 1+((wd-d.getDay()+7)%7)+(n-1)*7;};
  const last=(y,m,wd)=>{const dim=new Date(y,m,0).getDate(),d=new Date(y,m-1,dim);return dim-((d.getDay()-wd+7)%7);};
  const shun=y=>Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)), shuu=y=>Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
  function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),da=((h+l-7*mm+114)%31)+1;return new Date(y,mo-1,da);}
  function jp(y){const h={},a=(m,d)=>h[m+'-'+d]=1;a(1,1);a(1,nth(y,1,1,2));a(2,11);a(2,23);a(3,shun(y));a(4,29);a(5,3);a(5,4);a(5,5);a(7,nth(y,7,1,3));a(8,11);a(9,nth(y,9,1,3));a(9,shuu(y));a(10,nth(y,10,1,2));a(11,3);a(11,23);const r=Object.assign({},h);Object.keys(h).forEach(k=>{const[m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);if(dt.getDay()===0){let n=new Date(dt);do{n.setDate(n.getDate()+1);}while(r[(n.getMonth()+1)+'-'+n.getDate()]);r[(n.getMonth()+1)+'-'+n.getDate()]=1;}});return r;}
  function us(y){const h={},a=(m,d)=>h[m+'-'+d]=1;a(1,1);a(1,nth(y,1,1,3));a(2,nth(y,2,1,3));a(5,last(y,5,1));a(6,19);a(7,4);a(9,nth(y,9,1,1));a(10,nth(y,10,1,2));a(11,11);a(11,nth(y,11,4,4));a(12,25);return h;}
  function uk(y){const h={},a=(m,d)=>h[m+'-'+d]=1;const e=easter(y),gf=new Date(e);gf.setDate(e.getDate()-2);const em=new Date(e);em.setDate(e.getDate()+1);a(1,1);a(gf.getMonth()+1,gf.getDate());a(em.getMonth()+1,em.getDate());a(5,nth(y,5,1,1));a(5,last(y,5,1));a(8,last(y,8,1));a(12,25);a(12,26);return h;}
  function hol(y){return state.country==='none'?{}:state.country==='jp'?jp(y):state.country==='us'?us(y):uk(y);}

  const SF='"Hiragino Sans","Helvetica Neue","Noto Sans JP",sans-serif';
  const C={ink:'#2B2B2B', accent:'#C0743C', grey:'#6E6E6E'};

  function drawMonth(ox,oy,bw,bh,y,m){
    const h=hol(y), cols=7, colW=bw/cols;
    // month number — horizontal, spaced, top-left (like the reference)
    ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillStyle=C.ink; ctx.font='300 132px '+SF;
    ctx.letterSpacing='0.2em'; ctx.fillText(String(m).padStart(2,'0'), ox+8, oy+112); ctx.letterSpacing='0px';
    // weekday header — Mon-start English, Sunday accent
    ctx.textAlign='center'; ctx.font='400 42px '+SF; const headY=oy+232;
    for(let c=0;c<cols;c++){const wd=(state.weekStart+c)%7; ctx.fillStyle=wd===0?C.accent:C.grey; ctx.fillText(WK[wd], ox+colW*c+colW/2, headY);}
    const first=new Date(y,m-1,1).getDay(), off=(first-state.weekStart+7)%7, dim=new Date(y,m,0).getDate(), rows=Math.ceil((off+dim)/7);
    const gTop=headY+120, gBot=oy+bh, rowH=(gBot-gTop)/rows;
    ctx.font='300 74px '+SF;
    for(let i=0;i<rows*7;i++){const dn=i-off+1;if(dn<1||dn>dim)continue;
      const c=i%7,r=Math.floor(i/7),wd=(state.weekStart+c)%7,isHol=h[m+'-'+dn];
      ctx.fillStyle=(wd===0||isHol)?C.accent:C.ink;
      ctx.fillText(String(dn), ox+colW*c+colW/2, gTop+rowH*r);}
  }

  function draw(){
    const W=canvas.width,H=canvas.height;
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillStyle=C.ink; ctx.font='300 126px '+SF;
    ctx.fillText(String(state.year), W/2, 252);
    const L=150, Rm=150, top=480, bot=H-150, colGap=170, rowGap=200;
    const bw=(W-L-Rm-colGap)/2, bh=(bot-top-rowGap)/2;
    [state.start,state.start+1,state.start+2,state.start+3].forEach((m,idx)=>{
      drawMonth(L+(idx%2)*(bw+colGap), top+Math.floor(idx/2)*(bh+rowGap), bw, bh, state.year, m);});
  }

  function label(){const a=state.start;return state.lang==='ja'?state.year+' · '+a+'–'+(a+3)+'月':state.year+' · '+MN[a-1]+'–'+MN[a+2];}
  const $=id=>document.getElementById(id), h1=$('h1'),lede=$('lede'),lWeek=$('lWeek'),lHol=$('lHol'),wMon=$('wMon'),wSun=$('wSun'),download=$('download'),hint=$('hint');
  function applyLang(){const t=T[state.lang];h1.textContent=t.h1(state.year);lede.textContent=t.lede;lWeek.textContent=t.week;lHol.textContent=t.hol;wMon.textContent=t.mon;wSun.textContent=t.sun;download.textContent=t.dl;hint.textContent=t.hint;}
  function refresh(){ $('now').textContent=label(); applyLang(); draw(); }
  $('prev').onclick=()=>{ if(state.start===1){state.start=9;state.year--;}else state.start-=4; refresh(); };
  $('next').onclick=()=>{ if(state.start===9){state.start=1;state.year++;}else state.start+=4; refresh(); };
  function seg(id,key,cast){const g=$(id);g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');state[key]=cast(b.dataset.v);refresh();});}
  seg('weekStart','weekStart',v=>+v); seg('lang','lang',v=>v);
  $('country').onchange=e=>{state.country=e.target.value;refresh();};
  download.onclick=async()=>{
    draw();
    const fname='calendar-'+state.year+'-'+state.start+'.jpg';
    const dataUrl=canvas.toDataURL('image/jpeg',0.94);
    const bin=atob(dataUrl.split(',')[1]),arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:'image/jpeg'});
    // iPhone / Android: 共有メニューを開き「画像を保存」でカメラロールへ
    try{
      const file=new File([blob],fname,{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
    }catch(e){ if(e&&e.name==='AbortError') return; }
    // パソコン / Android Chrome: 通常のダウンロード
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  };
  refresh();
})();
</script>
